name: DockerBuild

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: striessnigk/willneverbefinishedbot

jobs:
  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # tags are needed to compute the version

      - name: Compute version
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -n1)
          LAST_TAG=${LAST_TAG:-0.0.0}
          LAST_TAG=${LAST_TAG#v}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG%%-*}"
          VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-dev"
          echo "last tag: ${LAST_TAG}, version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }} image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          pull: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest-dev
            ${{ env.IMAGE }}:${{ steps.version.outputs.VERSION }}
          build-args: |
            version=${{ steps.version.outputs.VERSION }}
            logLevel=info
          cache-from: type=gha
          cache-to: type=gha,mode=max